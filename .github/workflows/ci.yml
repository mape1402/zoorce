name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run css:build
      - run: dotnet restore Zoorce.slnx
      - run: dotnet build Zoorce.slnx --configuration Release --no-restore
      - run: npm run test:coverage
      - run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages
          done

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run css:build
      - run: dotnet restore Zoerce.slnx
      - run: dotnet build Zoerce.slnx --configuration Release --no-restore
      - run: npm run test:coverage
      - run: dotnet pack src/Zoorce.Web.UI.Abstractions/Zoorce.Web.UI.Abstractions.csproj --configuration Release --no-build --output artifacts/packages
      - run: dotnet pack src/Zoorce.Web.UI/Zoorce.Web.UI.csproj --configuration Release --no-build --output artifacts/packages

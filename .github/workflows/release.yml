name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run css:build
      - run: dotnet restore Zoorce.slnx
      - run: dotnet build Zoorce.slnx --configuration Release --no-restore
      - run: npm run test:coverage
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages -p:PackageVersion=${{ steps.version.outputs.value }}
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/packages/*.nupkg
